services:
  neo4j:
    image: neo4j:5
    container_name: neo4j_db
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    entrypoint: ["sh", "-c", "ollama serve > /dev/null 2>&1"]
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull gemma3:4b"]
    restart: "no"

  backend:
    image: ghcr.io/tfm-ucm-ciberseguridad-2026/orquestador-backend:latest
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: tfm_backend
    ports:
      - "8080:8080"
    environment:
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - PORT=8080
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=gemma3:4b
      # Credenciales Docker Hub para que Docker Scout funcione dentro del contenedor.
      # Crear un Personal Access Token (PAT) de solo lectura en: https://hub.docker.com/settings/security
      - DOCKER_HUB_USER=${DOCKER_HUB_USER:-}
      - DOCKER_HUB_TOKEN=${DOCKER_HUB_TOKEN:-}
      - AUDIT_LOG_PATH=/root/logs/audit.log
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/root/.docker/config.json:ro
      - ./logs:/root/logs
    restart: on-failure

  frontend:
    image: ghcr.io/tfm-ucm-ciberseguridad-2026/orquestador-frontend:latest
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: tfm_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_data: